<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee6">
  <title>Sign in · Cinder</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/login.js" defer></script>
</head>
<body>
  <div class="login">
    <img src="/static/icon.svg" alt="">
    <h1>Cinder</h1>
    <p>Fresh ideas from your repos, every morning.</p>
    <a id="oauth" class="btn primary hidden" href="/auth/login">Sign in with GitHub</a>
    <form id="code-form" class="hidden">
      <div>
        <label for="code">Access code</label>
        <input id="code" type="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="small muted">Run <code>python -m cinder info</code> on the Sprite to see the code.</p>
    </form>
    <p id="err" class="err" role="alert"></p>
  </div>
</body>
</html>
