<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cinder</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><img src="/static/icon.svg" alt=""> Cinder</div>
      <div class="spacer"></div>
      <span id="status" class="status-pill hidden"></span>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="inner">
      <a href="#/" data-tab="deck"><span class="ico" aria-hidden="true">🔥</span>Deck</a>
      <a href="#/saved" data-tab="saved"><span class="ico" aria-hidden="true">♥</span><span>Saved<span id="saved-count"></span></span></a>
      <a href="#/history" data-tab="history"><span class="ico" aria-hidden="true">↺</span>History</a>
      <a href="#/settings" data-tab="settings"><span class="ico" aria-hidden="true">⚙</span>Settings</a>
    </div>
  </nav>
</body>
</html>
